spring:
  application:
    name: analytics-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: localhost:9092
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

services:
  product:
    url: http://localhost:9998

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""

resilience4j:
  circuitbreaker:
    instances:
      orderServiceCB:
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      orderServiceRetry:
        maxAttempts: 2
        waitDuration: 100ms

jwt:
  secret: test-jwt-secret-key-for-analytics-svc
  issuer: universal-commerce
  audience: commerce-api
