# ==============================================================================
# SonarQube / SonarCloud Configuration - E-Commerce Platform Backend
# ==============================================================================

sonar.projectKey=ecommerce-platform-backend
sonar.projectName=E-Commerce Microservices Platform
sonar.projectVersion=1.0.0

# Source and test paths
sonar.sources=user-service/src/main/java,product-service/src/main/java,order-service/src/main/java,notification-service/src/main/java,api-gateway/src/main/java,discovery-server/src/main/java,config-server/src/main/java
sonar.tests=user-service/src/test/java,product-service/src/test/java,order-service/src/test/java,notification-service/src/test/java,api-gateway/src/test/java
sonar.java.binaries=user-service/target/classes,product-service/target/classes,order-service/target/classes,notification-service/target/classes,api-gateway/target/classes,discovery-server/target/classes,config-server/target/classes

# Source encoding and Java version
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# Exclusions from analysis (Generated files, OpenAPI Swagger configs, migrations)
sonar.exclusions=\
  **/db/migration/**,\
  **/config/OpenApiConfig.java,\
  **/config/GatewayOpenApiConfig.java,\
  **/target/**

# Test coverage & reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=**/target/surefire-reports
